[project]
name = "coin-backend"
version = "0.1.0"
description = "Challenge coin designer API and geometry engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=2.5.3",
    "shapely>=2.1.2",
    "trimesh>=5.1.0",
    "manifold3d>=3.5.4",
    "mapbox-earcut>=2.1.0",
    "fonttools>=4.66.1",
    "brotli>=1.2.0",
    "pillow>=12.3.0",
    "scikit-image>=0.26.0",
    "svgpathtools>=1.8.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=0.1",
    "ruff>=0.6",
    "matplotlib>=3.11.2",
    "lxml>=6.1.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
