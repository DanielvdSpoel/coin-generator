# Releases: pushing a tag vX.Y.Z builds both images tagged X.Y.Z (the SPA's
# version.txt says X.Y.Z) and creates a GitHub Release with generated notes.
# Deploying stays on main (prod.yml); a release marks what is live and lets
# `helm upgrade --set backend.image.tag=X.Y.Z` pin prod to a known version.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Images ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/danielvdspoel/coin-generator-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          body: |
            Images:
            - `ghcr.io/danielvdspoel/coin-generator-backend:${{ github.ref_name }}`
            - `ghcr.io/danielvdspoel/coin-generator-frontend:${{ github.ref_name }}`
