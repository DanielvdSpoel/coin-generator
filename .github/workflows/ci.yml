name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend · ruff
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  backend-test:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - run: uv sync --frozen
      - run: uv run pytest -q -W error

  frontend-lint:
    name: Frontend · lint + types
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx oxlint .
      - run: npx eslint .
      - run: npx prettier --check --experimental-cli src/
      - run: npm run type-check

  frontend-test:
    name: Frontend · vitest + build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx vitest --run
      - run: npm run build-only

  types-drift:
    name: Contract · OpenAPI → TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: cd backend && uv sync --frozen
      - run: make types
      - name: Fail when the committed schema or types are stale
        run: git diff --exit-code -- backend/openapi.json frontend/src/types/api.d.ts

  helm-lint:
    name: Deploy · helm lint + kubeconform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR (OCI chart dependencies)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - run: |
          for chart in preview prod; do
            helm dependency build deploy/$chart
            helm lint deploy/$chart --set host=pr-0.coins.example
            helm template test deploy/$chart --set host=pr-0.coins.example \
              --set backend.image.tag=ci --set frontend.image.tag=ci > rendered-$chart.yaml
            # CRDs (Traefik Middleware, ServiceMonitor, PrometheusRule) from the
            # community catalogue; fail on anything that does not validate.
            kubeconform -strict -summary -kubernetes-version 1.35.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              rendered-$chart.yaml
          done
      - name: Validate the cluster manifests
        run: |
          kubeconform -strict -summary -kubernetes-version 1.35.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/cluster/*.yml deploy/grafana/*.yml

  image-scan:
    name: Images · Trivy (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: coin-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
      - name: Image size
        run: |
          docker image inspect coin-${{ matrix.service }}:ci --format '{{.Size}}' \
            | awk '{printf "### ${{ matrix.service }} image: %.0f MB\n", $1/1e6}' >> "$GITHUB_STEP_SUMMARY"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: coin-${{ matrix.service }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd backend && uv sync --frozen
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: make e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
