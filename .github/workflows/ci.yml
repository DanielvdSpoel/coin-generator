name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend · ruff
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  backend-test:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - run: uv sync --frozen
      - run: uv run pytest -q -W error

  frontend-lint:
    name: Frontend · lint + types
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx oxlint .
      - run: npx eslint .
      - run: npx prettier --check --experimental-cli src/
      - run: npm run type-check

  frontend-test:
    name: Frontend · vitest + build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx vitest --run
      - run: npm run build-only

  helm-lint:
    name: Deploy · helm lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR (OCI chart dependencies)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: |
          for chart in preview prod; do
            helm dependency build deploy/$chart
            helm lint deploy/$chart --set host=pr-0.coins.example
            helm template test deploy/$chart --set host=pr-0.coins.example > /dev/null
          done
