# Production deploy: every push to main builds both images and upgrades the
# `coin-generator` release in the `coin-generator` namespace. A failed smoke test
# rolls back to the previous Helm revision.
#
# Required repo secret: KUBECONFIG_PROD (from deploy/generate-ci-kubeconfig.sh)
name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod
  cancel-in-progress: false

env:
  NAMESPACE: coin-generator
  RELEASE: coin-generator
  HOST: coins.danielvdspoel.com

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/danielvdspoel/coin-generator-${{ matrix.service }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://coins.danielvdspoel.com
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Configure kubeconfig
        env: { KUBECONFIG_DATA: "${{ secrets.KUBECONFIG_PROD }}" }
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Log in to GHCR (OCI chart dependencies)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: helm dependency build deploy/prod
      - name: Clear a stuck release (left behind by a cancelled run)
        run: |
          STATUS=$(helm status "$RELEASE" -n "$NAMESPACE" -o json 2>/dev/null | python3 -c 'import sys,json;print(json.load(sys.stdin)["info"]["status"])' || echo none)
          echo "release status: $STATUS"
          case "$STATUS" in
            pending-install)
              helm uninstall "$RELEASE" -n "$NAMESPACE" --no-hooks --wait --timeout 2m || true ;;
            pending-upgrade|pending-rollback)
              helm rollback "$RELEASE" -n "$NAMESPACE" --wait --timeout 2m || \
              kubectl -n "$NAMESPACE" delete secret -l "owner=helm,name=$RELEASE,status=$STATUS" ;;
          esac
      - name: Helm upgrade --install
        run: |
          helm upgrade --install "$RELEASE" deploy/prod \
            -n "$NAMESPACE" \
            --set backend.image.tag="sha-${{ github.sha }}" \
            --set frontend.image.tag="sha-${{ github.sha }}" \
            --wait --timeout 8m
      - name: Smoke test
        id: smoke
        run: |
          up=""
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://$HOST/api/health" | grep -q '"status":"ok"'; then up=1; break; fi
            sleep 10
          done
          [ -n "$up" ] || { echo "health never came up"; exit 1; }
          # The SPA answers, and a real (cached) preview build works end to end.
          curl -fsS --max-time 10 "https://$HOST/" | grep -q '<div id="app"' || { echo "SPA missing"; exit 1; }
          curl -fsS --max-time 30 -o /dev/null -X POST -H 'content-type: application/json' \
            -d '{"config": {}}' "https://$HOST/api/stats" || { echo "stats build failed"; exit 1; }
          echo "up"
      - name: Roll back on failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          helm rollback "$RELEASE" -n "$NAMESPACE" --wait --timeout 5m
          echo "::error::Deploy failed smoke test; rolled back to the previous revision"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deploy: ${{ job.status }}"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Smoke test: ${{ steps.smoke.outcome }}"
            echo "- URL: https://$HOST"
            echo ""
            echo '```'
            helm history "$RELEASE" -n "$NAMESPACE" --max 5 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
