# =============================================================================
# coin-generator-preview — per-PR environment
# =============================================================================
# CI installs one release per PR:
#   helm upgrade --install pr-<n> deploy/preview -n coin-generator-preview \
#     --set host=pr-<n>.coins.danielvdspoel.com \
#     --set backend.image.tag=sha-<sha> --set frontend.image.tag=sha-<sha>
#
# Everything lives in ONE namespace (coin-generator-preview) so a single
# namespace-scoped CI kubeconfig can create and destroy environments. The app is
# stateless, so a preview is just the two Deployments and an Ingress.
# =============================================================================

host: ""

ingress:
  className: traefik
  # Previews share the wildcard certificate *.coins.danielvdspoel.com issued once
  # by deploy/cluster/preview-wildcard-certificate.yml (DNS-01). With tlsSecretName
  # set, cert-manager is not involved per release: TLS is instant and there is
  # nothing to clean up on teardown.
  tlsSecretName: coins-preview-wildcard-tls
  certIssuer: letsencrypt-dns01
  annotations: {}

# Same templates as prod; previews keep the CRD-based extras off, so the
# namespace-scoped CI deployer needs no extra rights here and a preview is
# never paged on. Previews send no mail: without SMTP settings the app logs it.
apiMiddlewares:
  rateLimit: { enabled: false }
  buffering: { enabled: false }

networkPolicy:
  enabled: true
  fromNamespaces: [traefik]

monitoring:
  serviceMonitor: false
  prometheusRule: false
  minApiReplicas: 1

# -----------------------------------------------------------------------------
# API (web-service chart). Service name: <release>-api
# -----------------------------------------------------------------------------
backend:
  nameOverride: api
  image:
    repository: ghcr.io/danielvdspoel/coin-generator-backend
    tag: ""
  imagePullSecrets:
    - name: ghcr-secret
  replicas: 1
  port: 8000
  env:
    ENVIRONMENT: preview
    BUILD_WORKERS: "1"
    CORS_ORIGINS: ""
  livenessProbe:
    httpGet: { path: /api/healthz, port: http }
    initialDelaySeconds: 5
    periodSeconds: 30
  readinessProbe:
    httpGet: { path: /api/health, port: http }
    initialDelaySeconds: 3
    periodSeconds: 10
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
    seccompProfile: { type: RuntimeDefault }
  extraVolumes:
    - { name: tmp, emptyDir: {} }
  extraVolumeMounts:
    - { name: tmp, mountPath: /tmp }
  # Requests are scheduling reservations, not usage. The cluster is 3 × 2 vCPU and
  # nearly fully requested, so keep them small; limits still allow real builds.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  terminationGracePeriodSeconds: 30
  pdb: { enabled: false }
  hpa: { enabled: false }
  topologySpread: { enabled: false }
  ingress:
    enabled: false                    # the umbrella chart owns the Ingress

# -----------------------------------------------------------------------------
# SPA (web-service chart). Service name: <release>-web
# -----------------------------------------------------------------------------
frontend:
  nameOverride: web
  image:
    repository: ghcr.io/danielvdspoel/coin-generator-frontend
    tag: ""
  imagePullSecrets:
    - name: ghcr-secret
  replicas: 1
  port: 8080
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
    seccompProfile: { type: RuntimeDefault }
  extraVolumes:
    - { name: tmp, emptyDir: {} }
    - { name: nginx-cache, emptyDir: {} }
  extraVolumeMounts:
    - { name: tmp, mountPath: /tmp }
    - { name: nginx-cache, mountPath: /var/cache/nginx }
  livenessProbe:
    httpGet: { path: /health, port: http }
    initialDelaySeconds: 5
    periodSeconds: 30
  readinessProbe:
    httpGet: { path: /health, port: http }
    initialDelaySeconds: 2
    periodSeconds: 10
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  pdb: { enabled: false }
  hpa: { enabled: false }
  topologySpread: { enabled: false }
  ingress:
    enabled: false
